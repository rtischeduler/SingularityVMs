name: Crawl ref

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to crawl (same-site files and their paths are saved to ref/)"
        default: "https://www.onworks.net"
      max_files:
        description: "Max files to crawl"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: crawl-ref
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl site into ref/
        env:
          CRAWL_URL: ${{ inputs.url || 'https://www.onworks.net' }}
          MAX_FILES: ${{ inputs.max_files || '2000' }}
        run: |
          rm -rf ref
          python scripts/crawl_ref.py

      - name: Commit ref/ to main
        env:
          CRAWL_URL: ${{ inputs.url || 'https://www.onworks.net' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ref
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ref/ crawl of ${CRAWL_URL}"
            git pull --rebase origin main
            git push origin main
          fi
