name: Probe launch

# Records how onworks starts a session and a VM (headers, cookies, redirects, body) into ref/_probe/,
# the same way SingularityCloud's probe-backend records its backend.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS slug to launch"
        default: "ubuntu-22.04.3-desktop-amd64"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe launcher
        env:
          OS: ${{ inputs.os || 'ubuntu-22.04.3-desktop-amd64' }}
        run: |
          mkdir -p ref/_probe; cd ref/_probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          J=cookies.txt
          curl -sk -L --max-time 40 -A "$UA" -c $J -D 1-runonworks.headers -o 1-runonworks.html "https://www.onworks.net/playonline/runonworks.php" || true
          curl -sk -L --max-time 40 -A "$UA" -b $J -c $J -e "https://www.onworks.net/playonline/runonworks.php" -D 2-launch.headers -o 2-launch.html "https://www.onworks.net/playonline/index.php?os=$OS" || true
          curl -sk --max-time 20 -A "$UA" -b $J -D 3-launch-nofollow.headers -o /dev/null "https://www.onworks.net/playonline/index.php?os=$OS" || true
          # every playonline script the launch page loads (this is where the session/guacamole logic lives)
          for p in $(grep -o -E '/playonline/[^"'"'"' ]+\.js[^"'"'"' ]*' 2-launch.html | sort -u); do
            n=$(echo "$p" | sed 's#[/?=&]#_#g'); curl -sk --max-time 30 -A "$UA" -b $J -e "https://www.onworks.net/playonline/index.php" -D "script$n.headers" -o "script$n.js" "https://www.onworks.net$p" || true
          done
          # every URL, websocket and request the launch page mentions
          grep -o -i -E "(wss?|https?)://[^\"' <>)\\\\]+" 2-launch.html | sort -u > 4-urls.txt || true
          grep -n -i -E "new WebSocket|fetch\(|XMLHttpRequest|\.open\(|iframe|session|token|novnc|guac|rfb|vnc|rdp" 2-launch.html | cut -c1-300 > 5-session-lines.txt || true
          sed -i 's/\(Cookie:\).*/\1 <redacted>/' *.headers; : > cookies.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ref/_probe
          git commit -m "probe launch result" || true
          git pull --rebase origin main
          git push origin main
