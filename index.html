<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SingularityVMs</title>
<style>
:root{--bg:#0e1015;--panel:#171a22;--line:#262b38;--text:#e8eaf0;--muted:#8d95a8;--accent:#6c8cff;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--panel:#fff;--line:#dfe2ea;--text:#171a22;--muted:#5d6577;--accent:#3d5afe;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
#q{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
#chips{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;font:inherit;font-size:13px}
.chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:6px 18px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:8px;min-height:150px}
.card:hover{border-color:var(--accent)}
.card img{width:48px;height:48px;object-fit:contain;border-radius:10px;background:var(--bg)}
.card .n{font-weight:600;word-break:break-word}.card .k{color:var(--muted);font-size:12px;margin-top:auto}
#empty{padding:40px;text-align:center;color:var(--muted);display:none}
.launch{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:3px 8px;align-self:flex-start}

#session{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:50}
#session.on{display:flex}
#sbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#12151c;border-bottom:1px solid #262b38;color:#e8eaf0;font:14px system-ui,sans-serif}
#sbar b{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sbar button{border:1px solid #262b38;background:#171a22;color:#e8eaf0;border-radius:9px;padding:6px 10px;font:13px system-ui,sans-serif;cursor:pointer}
#sbar button.stop{border-color:#b33;color:#ff8a8a}
#screen{position:relative;flex:1;overflow:hidden;background:#000}
#smsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#e8eaf0;font:15px system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<header><h1>SingularityVMs</h1><input id="q" type="search" placeholder="Search systems and apps…" autocomplete="off"><span id="count" style="color:var(--muted);font-size:13px"></span></header>
<div id="chips"></div>
<main id="grid"></main>
<div id="empty">Nothing matches that search.</div>


<section id="session"><div id="sbar"><b id="stitle"></b><span id="sstate"></span><button id="cad">Ctrl+Alt+Del</button><button id="snd">Sound: on</button><button id="paste">Paste</button><button id="full">Fullscreen</button><button id="stop" class="stop">Stop</button></div><div id="screen"></div><div id="smsg"></div></section>
<script type="module">
import { launch } from "./app/js/vm.mjs";
const $ = (id) => document.getElementById(id);
let items = [], kind = "All", sess = null;

const res = await fetch("catalog.json").catch(() => null);
if (res && res.ok) items = (await res.json()).items.filter((i) => i.os);
const kinds = ["All", ...new Set(items.map((i) => i.kind))];
$("chips").innerHTML = kinds.map((k) => `<button class="chip${k === kind ? " on" : ""}" data-k="${k}">${k}</button>`).join("");
$("chips").onclick = (e) => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; kind = k; [...$("chips").children].forEach((c) => c.classList.toggle("on", c.dataset.k === k)); render(); };
$("q").oninput = render;

function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = items.filter((i) => (kind === "All" || i.kind === kind) && (!q || (i.name + " " + i.desc + " " + i.kind).toLowerCase().includes(q)));
  $("count").textContent = list.length + " of " + items.length;
  $("empty").style.display = list.length ? "none" : "block";
  $("grid").innerHTML = "";
  for (const it of list) {
    const b = document.createElement("button"); b.className = "card";
    const img = it.icon ? `<img loading="lazy" referrerpolicy="no-referrer" alt="" src="${it.icon}">` : `<img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23262b38'/%3E%3C/svg%3E">`;
    b.innerHTML = `${img}<span class="n"></span><span class="k"></span>`;
    b.querySelector(".n").textContent = it.name; b.querySelector(".k").textContent = it.kind;
    b.onclick = () => start(it);
    $("grid").append(b);
  }
}

const say = (t) => { $("smsg").textContent = t || ""; };
async function start(it) {
  if (sess) return;
  $("session").classList.add("on"); $("stitle").textContent = it.name; $("sstate").textContent = "";
  history.replaceState(null, "", "#" + it.id); snd = true; $("snd").textContent = "Sound: on";
  try {
    sess = await launch(it.os, { el: $("screen"), say, onState: (st, name) => { $("sstate").textContent = name; if (st === 5) say("Session ended. Press Stop to return."); } });
  } catch (e) { say("Couldn’t start this VM: " + (e && e.message || e) + " — press Stop to go back."); sess = null; failed = true; }
}
let failed = false;
function stop() { if (sess) sess.stop(); sess = null; failed = false; say(""); $("sstate").textContent = ""; $("session").classList.remove("on"); history.replaceState(null, "", location.pathname); }
$("stop").onclick = stop;
let snd = true;
$("snd").onclick = () => { snd = !snd; if (sess) sess.sound(snd); $("snd").textContent = "Sound: " + (snd ? "on" : "off"); };
$("cad").onclick = () => sess && sess.ctrlAltDel();
$("paste").onclick = async () => { try { const t = await navigator.clipboard.readText(); sess && t && sess.paste(t); } catch { say("Clipboard permission was blocked."); setTimeout(() => say(""), 2500); } };
$("full").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : $("session").requestFullscreen && $("session").requestFullscreen());

render();
const hit = items.find((i) => i.id === location.hash.slice(1) || i.os === new URLSearchParams(location.search).get("os"));
if (hit) start(hit);
</script>
</body>
</html>
