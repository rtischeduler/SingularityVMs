<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SingularityVMs</title>
<style>
:root{--bg:#0e1015;--panel:#171a22;--line:#262b38;--text:#e8eaf0;--muted:#8d95a8;--accent:#6c8cff;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--panel:#fff;--line:#dfe2ea;--text:#171a22;--muted:#5d6577;--accent:#3d5afe;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
#q{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
#chips{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;font:inherit;font-size:13px}
.chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:6px 18px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:8px;min-height:150px}
.card:hover{border-color:var(--accent)}
.card img{width:48px;height:48px;object-fit:contain;border-radius:10px;background:var(--bg)}
.card .n{font-weight:600;word-break:break-word}.card .k{color:var(--muted);font-size:12px;margin-top:auto}
#empty{padding:40px;text-align:center;color:var(--muted);display:none}
#app{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#app.on{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#bar .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#stage{flex:1;position:relative}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);text-align:center;padding:24px;background:var(--bg)}
#msg.hide{display:none}
</style>
</head>
<body>
<header><h1>SingularityVMs</h1><input id="q" type="search" placeholder="Search systems and apps…" autocomplete="off"><span id="count" style="color:var(--muted);font-size:13px"></span></header>
<div id="chips"></div>
<main id="grid"></main>
<div id="empty">Nothing matches that search.</div>

<section id="app" aria-label="Running app">
  <div id="bar">
    <button class="btn" id="back">← Back</button>
    <span class="t" id="title"></span>
    <button class="btn" id="page">Page</button>
    <button class="btn pri" id="vm">Launch VM</button>
    <a class="btn" id="ext" target="_blank" rel="noopener">Open on onworks</a>
  </div>
  <div id="stage"><div id="msg" class="hide"></div><iframe id="frame" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads" allow="fullscreen; clipboard-read; clipboard-write; microphone; camera"></iframe></div>
</section>

<script type="module">
import { proxyFetch, currentMode } from "./app/js/net.js";
const $ = (id) => document.getElementById(id);
let items = [], site = "https://www.onworks.net", kind = "All", cur = null;

const res = await fetch("catalog.json").catch(() => null);
if (res && res.ok) { const d = await res.json(); items = d.items; site = d.site; }
const kinds = ["All", ...[...new Set(items.map((i) => i.kind))]];
$("chips").innerHTML = kinds.map((k) => `<button class="chip${k === kind ? " on" : ""}" data-k="${k}">${k}</button>`).join("");
$("chips").onclick = (e) => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; kind = k; [...$("chips").children].forEach((c) => c.classList.toggle("on", c.dataset.k === k)); render(); };
$("q").oninput = render;

function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = items.filter((i) => (kind === "All" || i.kind === kind) && (!q || (i.name + " " + i.desc + " " + i.kind).toLowerCase().includes(q)));
  $("count").textContent = list.length + " of " + items.length;
  $("empty").style.display = list.length ? "none" : "block";
  $("grid").innerHTML = "";
  for (const it of list) {
    const b = document.createElement("button"); b.className = "card";
    const img = it.icon ? `<img loading="lazy" referrerpolicy="no-referrer" alt="" src="${it.icon}">` : `<img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23262b38'/%3E%3C/svg%3E">`;
    b.innerHTML = `${img}<span class="n"></span><span class="k"></span>`;
    b.querySelector(".n").textContent = it.name; b.querySelector(".k").textContent = it.kind;
    b.onclick = () => open(it);
    $("grid").append(b);
  }
}

function say(html) { const m = $("msg"); m.classList.remove("hide"); m.innerHTML = html; }
function done() { $("msg").classList.add("hide"); }

/** Fetch an onworks page through the proxy and show it in the sandboxed frame (base href keeps its assets working). */
async function show(url, label) {
  say(`<div>Loading ${label}…</div><div style="font-size:12px">via proxy</div>`);
  try {
    const r = await proxyFetch(url, { headers: { Accept: "text/html" } }, { say: (t) => say(`<div>${t}</div>`) });
    let html = await r.text();
    if (!/<base\s/i.test(html)) html = html.replace(/<head[^>]*>/i, (m) => `${m}<base href="${url}">`);
    $("frame").srcdoc = html; done();
  } catch (e) { say(`<div>Couldn’t load that through the proxy.</div><div style="font-size:12px">${String(e && e.message || e)}</div>`); }
}

function open(it) {
  cur = it; $("title").textContent = it.name; $("ext").href = it.page;
  $("vm").style.display = it.os ? "" : "none";
  $("app").classList.add("on"); history.replaceState(null, "", "#" + it.id);
  show(it.page, it.name);
}
$("page").onclick = () => cur && show(cur.page, cur.name);
$("vm").onclick = () => cur && cur.os && show(`${site}/playonline/index.php?os=${encodeURIComponent(cur.os)}`, cur.name + " (VM)");
$("back").onclick = () => { $("app").classList.remove("on"); $("frame").srcdoc = ""; history.replaceState(null, "", location.pathname + location.search); };

render();
const start = location.hash.slice(1); const hit = items.find((i) => i.id === start); if (hit) open(hit);
</script>
</body>
</html>
